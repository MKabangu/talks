title: Quarto Live
author: George Stagg
version: 0.1.3-dev
quarto-required: ">=1.4.0"
contributes:
  filters:
    - live.lua
  formats:
    common:
      ojs-engine: true
      filters:
        - live.lua
    html: default
    revealjs: 
      theme: [default, clean.scss]
      menu:
        side: left
      slide-number: true
      date-format: long
      html-math-method:
        method: mathjax
        url: "https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"
      include-before-body:
        - text: |
            <script src="mathjax-config.js"></script>
      format-resources:
        - mathjax-config.js
    dashboard: default
